<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Shell only: title, description and every visible string come from
     i18n/<locale>.js and are applied by manual.js. -->
<title></title>
<meta name="description" content="">
<meta name="theme-color" content="#f6f2ea">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://fabianosobreira.github.io/piv-pipeline/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<link rel="stylesheet" href="styles.css">
<script defer src="i18n/en-US.js"></script>
<script defer src="i18n/pt-BR.js"></script>
<script defer src="manual.js"></script>
</head>
<body class="is-loading">

<a class="skip-link" href="#content" data-i18n="ui.skipLink"></a>

<div class="topbar">
  <a class="topbar-brand" href="#top" data-i18n="ui.brand"></a>
  <button class="menu-button" type="button" aria-expanded="false" aria-controls="sidebar" data-menu-toggle>
    <span class="menu-icon" aria-hidden="true"></span>
    <span data-menu-label></span>
  </button>
</div>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#top" data-i18n="ui.brand"></a>
    <nav data-i18n-attr="aria-label:ui.navLabel">
      <ol class="nav" data-slot="nav"></ol>
    </nav>
  </aside>
  <div class="scrim" data-menu-close aria-hidden="true"></div>

  <main class="main" id="content" tabindex="-1">
    <div class="content">

      <div class="masthead">
        <div class="lang-switch" role="group" data-i18n-attr="aria-label:ui.languageLabel" data-slot="lang"></div>
      </div>

      <header class="hero" id="top">
        <div class="hero-text">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 class="hero-title" data-i18n="hero.title"></h1>
          <p class="hero-lede" data-i18n="hero.lede"></p>
        </div>
        <svg class="hero-loop" viewBox="0 0 280 280" aria-hidden="true" focusable="false">
          <circle class="loop-orbit" cx="140" cy="140" r="128"></circle>
          <g class="loop-arcs" transform="rotate(-90 140 140)">
            <circle class="loop-arc loop-arc--plan" cx="140" cy="140" r="104" pathLength="300" stroke-dasharray="92 208" stroke-dashoffset="-4"></circle>
            <circle class="loop-arc loop-arc--implement" cx="140" cy="140" r="104" pathLength="300" stroke-dasharray="92 208" stroke-dashoffset="-104"></circle>
            <circle class="loop-arc loop-arc--verify" cx="140" cy="140" r="104" pathLength="300" stroke-dasharray="92 208" stroke-dashoffset="-204"></circle>
          </g>
          <circle class="loop-core" cx="140" cy="140" r="58"></circle>
          <circle class="loop-seed" cx="140" cy="140" r="5"></circle>
        </svg>
      </header>

      <div data-slot="sections"></div>

    </div>
  </main>

</div>

</body>
</html>
